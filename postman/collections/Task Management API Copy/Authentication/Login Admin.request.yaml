$kind: http-request
url: "{{base_url}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@example.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.token) {
          pm.collectionVariables.set('token', jsonData.token);
      }
    language: text/javascript
order: 3000
